# CONFIGURATION, NOT CODE: GitHub Actions only reads YAML. All logic lives in
# Zig (`zig build` steps and ZVC itself); this file only runs them in order.
# Any failing step stops the run before the release.
#
# Builds and publishes ZVC when its known-good Zig record changes on main.
#
# Two jobs, so the write token never meets the build: `build` (contents:
# read, no token in any step) installs the known-good Zig, tests, builds and
# checks the six binaries and uploads them with the tag and notes as an
# artifact; `publish` (contents: write) only downloads them and creates the
# release, with GH_TOKEN on that one step. The only actions are the official
# upload-artifact and download-artifact, pinned by full commit SHA. Values
# reach `run:` lines only through `env:`.
name: release

on:
  push:
    branches: [main]
    paths: [src/known-good-zig.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pushed commit
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # The previous release's ZVC (built with a verified Zig) installs the
      # known-good Zig recorded in this commit, checked against ziglang.org's
      # minisign signature (and the index's sha256 when the index lists it).
      - name: Install the known-good Zig with the last released ZVC
        run: |
          mkdir -p "$RUNNER_TEMP/zvc"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/zvc-x86_64-linux" -o "$RUNNER_TEMP/zvc/zvc-x86_64-linux"
          chmod +x "$RUNNER_TEMP/zvc/zvc-x86_64-linux"
          "$RUNNER_TEMP/zvc/zvc-x86_64-linux" install --known-good . < /dev/null
          echo "$HOME/.local/share/zvc/zig" >> "$GITHUB_PATH"

      - name: Check the Zig version
        run: zig build check-zig

      - name: Test
        run: zig build test

      - name: Build the six binaries and check them for build-machine paths
        run: zig build check-dist

      - name: Write the release tag and notes
        run: zig build release-info

      - name: Gather the release files
        run: |
          mkdir -p release/dist
          cp zig-out/dist/* release/dist/
          cp zig-out/release/tag.txt zig-out/release/notes.md release/
      - name: Upload them
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zvc-release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: zvc-release
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$(cat release/tag.txt)"
          release/dist/*
          --target "$GITHUB_SHA"
          --title "$(cat release/tag.txt)"
          --notes-file release/notes.md
          --latest
